name: Release

# Push a tag equal to the manifest version (no "v"), e.g. `npm version 0.1.2 && git push --follow-tags`.
on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check the tag matches manifest.json
        run: test "$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/main.js manifest.json --title "$GITHUB_REF_NAME" --generate-notes
